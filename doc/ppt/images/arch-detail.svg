<text x="937" y="630" text-anchor="middle" fill="#0a1f3d" font-family="IBM Plex Mono, Noto Sans SC, sans-serif" font-size="11" font-weight="500">RK45 · call score each step · repeat K=50</text>
<text x="937" y="652" text-anchor="middle" fill="#0a1f3d" font-family="IBM Plex Mono, Noto Sans SC, sans-serif" font-size="11" font-weight="500">then Energy rank → mean pool → Scale</text>
