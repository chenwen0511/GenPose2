<text x="335" y="652" text-anchor="middle" fill="#0a1f3d" font-family="IBM Plex Mono, Noto Sans SC, sans-serif" font-size="11" font-weight="500">Energy: same DSM on ∇Ψ ; IP param Ψ=⟨p,Φ⟩</text>
